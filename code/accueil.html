<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Accueil</title>
</head>
<body class="font-[Inter] md:h-[100vh]">
    <header class="hidden md:block h-[10vh] bg-[#F2F2FA]">
        <div class="w-fit h-[100%] flex items-center gap-[16px] pl-[48px]">
            <div class="h-[80%] bg-[#324A5F] rounded-[10px]">
                <img class="h-[100%]" src="../media/logo_white.png" alt="logo YCD Bank">
            </div>
            <p class="text-[#324A5F] text-[32px] font-bold">YCD BANK</p>
        </div>
    </header>
    <main class="bg-[#CCC9DC] w-full h-[100vh] md:h-[90vh] flex flex-col items-center md:justify-center md:pt-0 gap-[64px] pt-[71px] md:bg-[#E6E6FA]">
        <div class="w-full flex flex-col items-center gap-[16px] md:hidden">
            <img class="w-1/3" src="../media/logo_black.png" alt="logo YCD Bank">
            <div class="w-fit text-center flex flex-col gap-[8px]">
                <h1 class="font-bold text-2xl">YCD BANK</h1>
                <p class="text-nowrap text-base text-[#324A5F]">EMPOWERING YOUR FINANCIAL FU</p>
            </div>
        </div>
        <div class="w-9/10 text-center flex flex-col items-center gap-[24px] md:w-[47%] md:h-fit">
            <p class="font-bold text-[22.13px] md:text-[40px]">Bienvenue chez <br class="md:hidden">YCD Bank</p>
            <p class="hidden md:block">Votre partenaire financier de confiance pour une gestion simplifiée.</p>
            <div class="flex flex-col gap-[32px] py-[16px] md:py-0 md:gap-[16px] w-full md:w-[73%] md:h-[53%]">
                <a class="w-full drop-shadow-lg/50" href="connexion.html">
                    <button class="w-full h-[64px] bg-white md:bg-[#324A5F] md:text-white rounded-[30px] font-medium text-[20px] text-black">Connexion</button>
                </a>
                <a class="w-full drop-shadow-lg/50 md:drop-shadow-none" href="inscription.html">
                    <button class="w-full h-[64px] bg-white md:bg-[#F2F2FA] rounded-[30px] md:border-[#324A5F] md:border-[2px] md:text-[#324A5F] font-medium text-[20px] text-black">Inscription</button>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
