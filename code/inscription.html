<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>Inscription</title>
</head>
<body class="font-['Inter'] h-[100vh] w-[100wh] bg-[#CCC9DC] flex flex-col gap-[5%]">
    <header class="h-[10vh]">
        <div class="h-full w-fit flex items-center pl-[16px] py-[4px]">
            <img class="h-[80%]" src="../media/logo_black.png" alt="logo YCD Bank">
            <p class="font-medium text-lg  h-fit">YCD Bank</p>
        </div>
    </header>
    <main class="bg-[#CCC9DC] h-[90vh] flex flex-col gap-[10%] items-center box-sizing">
        <div class="flex flex-col justify-between h-full pb-[5%] items-center w-[90%]">
            <div class="drop-shadow-lg/50 flex flex-col items-center gap-[32px] h-[80%] rounded-[30px] bg-[url('../media/background.jpeg')] bg-cover bg-center w-[80%]">
                <h3 class="font-medium text-[18px] text-center mt-[16px]">Inscription</h3>
                <form class="flex flex-col gap-3 items-center w-full">
                    <div class="grid grid-cols-2 gap-3 w-[90%]">
                        <label for="prenom ">Prénom</label>
                        <label for="nom">Nom</label>
                        <input class="border-2 border-[#324A5F] py-[8px] rounded-[30px] bg-[#EDEEF2]" type="text" name="prenom" id="prenom">
                        <input class="border-2 border-[#324A5F] py-[8px] rounded-[30px] bg-[#EDEEF2]" type="text" name="nom" id="nom">
                    </div>
                    <label class="self-start ml-[5%]" for="email">Mail</label>
                    <input class="border-2 border-[#324A5F] w-[90%] font-normal text-[16px] py-[8px] rounded-[30px] bg-[#EDEEF2]" type="email" name="email" id="email">
                    <div class="grid grid-cols-4 gap-3 w-[90%]">
                        <label class="col-span-2" for="prenom">Pays</label>
                        <label class="col-span-2" for="nom">Ville</label>
                        <input class="border-2 border-[#324A5F] col-span-2 py-[8px] rounded-[30px] bg-[#EDEEF2]" type="text" name="prenom" id="prenom">
                        <input class="border-2 border-[#324A5F] col-span-2 py-[8px] rounded-[30px] bg-[#EDEEF2]" type="text" name="nom" id="nom">
                        <label class="col-span-4" for="quartier">Quartier</label>
                        <input class="border-2 border-[#324A5F] col-span-4 py-[8px] rounded-[30px] bg-[#EDEEF2]" type="text" name="quartier" id="quartier">
                    </div>
                </form>
            </div>
            <button class="inset-shadow-sm/50 font-medium text-[18px] text-white bg-[#324A5F] py-[16px] w-[80%] rounded-[30px]">Suivant</button>
        </div>
    </main>
</body>
</html>
