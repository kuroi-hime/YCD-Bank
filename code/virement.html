<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <title>Virement</title>
</head>
<body class="bg-gray-100">


  <header >

        <div class="flex justify-between items-center relative ">
             <div id="Hamburger-menu" >
                <button id="menu-btn" class="md:hidden ml-4">
                <i id="menu-icon" class="fa-solid fa-bars"></i>
                </button>

        <div id="menu" class="left-1 absolute border-2 border-[#324A5F] mt-2 flex flex-col justify-around bg-gray-100 p-3 rounded-3xl shadow-md transform scale-y-0 origin-top transition-transform duration-300 ease-out h-auto w-auto">
            
            <!--Menu elements-->

            <div class="flex gap-2 items-center ">
            <i class="fa-solid fa-money-bill text-blue-600"></i>
            <a href="paiement.html" class="py-2 hover:text-green-600">Paiements</a>
            </div>

            <div class="flex gap-2 items-center " >
            <i class="fa-solid fa-money-bill-transfer text-green-600"></i>
            <a href="virement.html" class="py-2 hover:text-green-600">Virement</a>
            </div>


            <div class="flex gap-2 items-center ">
            <i class="fa-solid fa-clock-rotate-left text-orange-500"></i>
            <a href="historiques.html" class="py-2 hover:text-green-600">Historique</a>
            </div>

            <div class="flex gap-2 items-center ">
            <i class="fa-solid fa-credit-card fa-2xs text-purple-500"></i>
            <a href="" class="py-2 hover:text-green-600">Mes cartes</a>
            </div>
         </div>
        </div>

        <div class="flex items-center p-3">
            <img src="../media/ycdbanklogo-noBG.png" style="width: 59px; height: 50px;">
            <h2 class="font-medium" style="font-size:18px;">YCD Bank</h2>
        </div>
        
        <div id="user-notif">
        <div class="flex  gap-4 mr-4">
            <button id="notification-bell-btn">
               <i id="notification-bell-icon"  class="fa-regular fa-bell fa-lg"></i>
            </button>
            <button id="user-circle-btn">
               <i id="user-circle" class="fa-regular fa-circle-user fa-lg"></i>
            </button>
        </div>


        <div id="DECONNECT" class="right-1 absolute border-2 border-[#324A5F] mt-2 bg-gray-100 p-3 rounded-3xl shadow-md transform scale-y-0 origin-top transition-transform duration-300 ease-out h-auto w-[40%]">
            
            <div class="flex gap-2 items-center ">
                <button id="DECONNECT-btn">
                    <i id ="deconnect-icon" class="fa-solid fa-toggle-on text-green-600"></i>
                </button>
                <p class="text-bold">Deconnexion</p>
            </div>


         </div>
        </div>
        
        </div>

    </header>
  
  
  <main>
    <!-- Account to Debit -->
    <section class="account-information h-[118px] mt-[40px]">
      <div class="flex justify-around">
        <div class="flex flex-col gap-2">
          <h2 class="font-bold text-[16px]">Compte à Débiter</h2>
          <p>Compte Principale</p>
          <p>4210 9834 7612 5098 3476 1209</p>
        </div>
        <div class="flex flex-col justify-around items-center h-24">
          <div class="flex gap-2 ml-20">
            <i class="fa-solid fa-circle fa-2xs text-[#05B013]"></i>
            <i class="fa-solid fa-circle fa-2xs text-[#CCC9DC]"></i>
          </div>
          <div class="flex flex-col items-center">
            <p>7000 MAD</p>
            <button aria-label="Toggle visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Arrow -->
    <div class="flex justify-center items-center">
      <span class="text-5xl drop-shadow-[0_6px_6px_#05B013]">↓</span>
    </div>

    <!-- Account to Credit -->
    <section class="account-information h-[118px] mt-[40px]">
      <div class="flex justify-between items-start">
        <div class="flex flex-col ml-20 gap-2">
          <h2 class="font-bold text-[16px]">Compte à Créditer</h2>
          <p>Halima Hamada</p>
          <p>5210 1834 7612 8098 7476 8209</p>
        </div>
        <div class="flex gap-2 mr-20 mt-1">
          <i class="fa-solid fa-circle fa-2xs text-[#05B013]"></i>
          <i class="fa-solid fa-circle fa-2xs text-[#CCC9DC]"></i>
          <i class="fa-solid fa-circle fa-2xs text-[#CCC9DC]"></i>
          <i class="fa-solid fa-circle fa-2xs text-[#CCC9DC]"></i>
          <i class="fa-solid fa-circle fa-2xs text-[#CCC9DC]"></i>
        </div>
      </div>
    </section>

    <!-- Transaction Form -->
    <section class="transaction-information flex justify-center items-center">
      <div class="grid grid-cols-2 gap-y-4 gap-x-6 rounded-3xl bg-[#324A5F] p-6 mt-3 w-[80%]">
        <label for="montant" class="text-white self-center">Montant :</label>
        <input id="montant" type="number" class="rounded-3xl bg-[#EDEEF2] px-4 py-2 w-full drop-shadow-[0_4px_6px_black]" />

        <label for="motif" class="text-white self-center">Motif :</label>
        <input id="motif" type="text" class="rounded-3xl bg-[#EDEEF2] px-4 py-2 w-full drop-shadow-[0_4px_6px_black]" />

        <label for="password" class="text-white self-center">Mot de passe :</label>
        <input id="password" type="password" class="rounded-3xl bg-[#EDEEF2] px-4 py-2 w-full drop-shadow-[0_4px_6px_black]" />
      </div>
    </section>

    <div class="flex items-center justify-center mt-4">
      <button class="rounded-3xl bg-[#324A5F] px-4 py-2 w-[70%] drop-shadow-[0_4px_6px_black]">
        <span class="text-white text-[18px]">Valider</span>
      </button>
    </div>
  </main>

  <script src="js/virement.js"></script>

</body>
</html>
