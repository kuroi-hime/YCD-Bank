<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Bénéficiaires</title>
</head>

<body class="bg-white">
<header>

    <div class="flex justify-between items-center relative ">
        <div id="Hamburger-menu">
            <button id="menu-btn" class="md:hidden ml-4">
                <i id="menu-icon" class="fa-solid fa-bars"></i>
            </button>

            <div id="menu"
                class="absolute border-2 border-[#324A5F] mt-2 flex flex-col bg-gray-100 p-3 rounded-3xl shadow-md transform scale-y-0 origin-top transition-transform duration-300 ease-out">
                
                <div class="flex gap-2 items-center">
                    <i class="fa-solid fa-money-bill text-blue-600"></i>
                    <a href="paiement.html" class="py-2 hover:text-green-600">Paiements</a>
                </div>

                <div class="flex gap-2 items-center">
                    <i class="fa-solid fa-money-bill-transfer text-green-600"></i>
                    <a href="virement.html" class="py-2 hover:text-green-600">Virement</a>
                </div>

                <div class="flex gap-2 items-center">
                    <i class="fa-solid fa-clock-rotate-left text-orange-500"></i>
                    <a href="historiques.html" class="py-2 hover:text-green-600">Historique</a>
                </div>

                <div class="flex gap-2 items-center">
                    <i class="fa-solid fa-credit-card text-purple-500"></i>
                    <a href="cartes.html" class="py-2 hover:text-green-600">Mes cartes</a>
                </div>
            </div>
        </div>


        <div class="flex items-center p-3">
            <img src="../media/ycdbanklogo-noBG.png" style="width: 59px; height: 50px;">
            <h2 class="font-medium" style="font-size:18px;">YCD Bank</h2>
        </div>

    
        <div id="user-notif">
            <div class="flex gap-4 mr-4">
                <button id="notification-bell-btn">
                    <i id="notification-bell-icon" class="fa-regular fa-bell fa-lg"></i>
                </button>
                <button id="user-circle-btn">
                    <i id="user-circle" class="fa-regular fa-circle-user fa-lg"></i>
                </button>
            </div>

            <div id="DECONNECT"
                class="absolute right-1 border-2 border-[#324A5F] mt-2 bg-gray-100 p-3 rounded-3xl shadow-md transform scale-y-0 origin-top transition-transform duration-300 ease-out w-[40%]">
                
                <div class="flex gap-2 items-center">
                    <button id="DECONNECT-btn">
                        <i class="fa-solid fa-toggle-on text-green-600"></i>
                    </button>
                    <p class="font-bold">Déconnexion</p>
                </div>

            </div>
        </div>

    </div>

</header>


<main class="p-5">


    <h2 class="font-bold text-lg mb-4">Mes Bénéficiaires</h2>


    <div class="flex justify-end mb-4">
        <button id="add-benef-btn"
            class="flex items-center gap-2 bg-[#324A5F] text-white px-4 py-2 rounded-3xl shadow-md hover:bg-[#223342]">
            <i class="fa-solid fa-user-plus"></i>
            Ajouter
        </button>
    </div>

    
    <section id="benef-list" class="flex flex-col gap-4">


        <div class="border rounded-3xl p-4 shadow-sm bg-gray-50">
            <div class="flex justify-between">
                <div class="flex flex-col gap-1">
                    <p class="font-semibold">Halima Hamada</p>
                    <p class="text-sm">RIB: 4210 9834 7612 5098</p>
                    <p class="text-sm text-green-600 font-semibold">Externe</p>
                </div>
            </div>
        </div>

        <div class="border rounded-3xl p-4 shadow-sm bg-gray-50">
            <div class="flex justify-between">
                <div class="flex flex-col gap-1">
                    <p class="font-semibold">Mohamed Amine</p>
                    <p class="text-sm">RIB: 2981 0093 5620 0091</p>
                    <p class="text-sm text-green-600 font-semibold">Interne</p>
                </div>
            </div>
        </div>

    </section>


    <div id="add-popup"
        class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center hidden">

        <div class="bg-white rounded-3xl p-6 w-[85%] shadow-xl">

            <h3 class="font-bold text-lg mb-4">Ajouter un bénéficiaire</h3>

            <div class="flex flex-col gap-4">

                <input type="text" id="benef-name" placeholder="Nom complet"
                    class="border rounded-xl p-2 focus:outline-none">

                <input type="text" id="benef-rib" placeholder="RIB"
                    class="border rounded-xl p-2 focus:outline-none">

                <select id="benef-type" class="border rounded-xl p-2 focus:outline-none">
                    <option value="Interne">Interne</option>
                    <option value="Externe">Externe</option>
                </select>

                <div class="flex justify-end gap-3 mt-3">
                    <button id="cancel-btn"
                        class="px-4 py-2 bg-gray-300 rounded-3xl hover:bg-gray-400">Annuler</button>
                    <button id="save-benef-btn"
                        class="px-4 py-2 bg-green-600 text-white rounded-3xl hover:bg-green-700">Ajouter</button>
                </div>

            </div>

        </div>

    </div>

</main>


<script src="../js/benificaires.js"></script>
<script src="../js/compte.js"></script>

</body>
</html>
