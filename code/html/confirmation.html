<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <title>Inscription</title>
    </head>
    <body class="font-['Inter'] h-[100vh] w-[100wh] bg-[#CCC9DC] flex flex-col gap-[5%]">
        <header class="h-[10vh]">
            <div class="h-full w-fit flex items-center pl-[16px] py-[4px]">
                <img class="h-[80%]" src="../../media/logo_black.png" alt="logo YCD Bank">
                <p class="font-medium text-lg  h-fit">YCD Bank</p>
            </div>
        </header>
        <main class="bg-[#CCC9DC] h-[90vh] flex flex-col gap-[10%] items-center box-sizing">
            <div class="flex flex-col justify-between h-full pb-[5%] items-center w-[90%]">
                <div class="w-[80%] h-[90%] flex items-center">
                    <div class="self-center drop-shadow-lg/50 flex flex-col items-center gap-[32px] h-fit py-4 rounded-[30px] bg-[url('../../media/background.jpeg')] bg-cover bg-center w-full">
                        <h3 class="font-medium text-[22.13px] text-center">Confirmation mot de passe</h3>
                        <form class="flex flex-col gap-3 items-center w-full">
                            <label class="self-start ml-[5%]" for="password">Mot de passe</label>
                            <input class="placeholder:text-[12px] border-2 border-[#324A5F] w-[90%] font-normal text-[16px] py-[8px] rounded-[10px] bg-[#EDEEF2] pl-[5%]" type="password" name="password" id="password" placeholder="Entrer un mot de passe de 8 à 16 caractères" autocomplete="new-password">
                            <label class="self-start ml-[5%]" for="password_confirmation">Confirmation mot de passe</label>
                            <input class="placeholder:text-[12px] border-2 border-[#324A5F] w-[90%] font-normal text-[16px] py-[8px] rounded-[10px] bg-[#EDEEF2] pl-[5%]" type="password" name="password_confirmation" id="password_confirmation" placeholder="Celui-ci doit être identique au premier" autocomplete="current-password">
                        </form>
                    </div>
                </div>
                <button class="inset-shadow-sm/50 font-medium text-[18px] text-white bg-[#324A5F] py-[16px] w-[80%] rounded-[30px]">Suivant</button>
            </div>
        </main>
        <div id="alertFaild" class="fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded shadow-md hidden"></div>
        
        <script src="../js/confirmation.js"></script>
    </body>
</html>
