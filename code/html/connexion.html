<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <title>Connexion</title>
    </head>
    <body class="font-['Inter'] h-[100vh] w-[100wh] bg-[#CCC9DC] flex flex-col gap-[10%]">
        <header class="h-[10vh]">
            <div class="h-full w-fit flex items-center pl-[16px] py-[4px]">
                <img class="h-[80%]" src="../../media/logo_black.png" alt="logo YCD Bank">
                <p class="font-medium text-lg  h-fit">YCD Bank</p>
            </div>
        </header>
        <main class="bg-[#CCC9DC] h-[90vh] flex flex-col gap-[10%] items-center box-sizing">
            <h2 class="font-bold text-[24px] text-center">Bienvenue</h2>
            <div class="flex flex-col justify-between h-full pb-[5%] items-center w-[90%]">
                <div class="drop-shadow-lg/50 flex flex-col items-center gap-[32px] h-[70%] rounded-[30px] bg-[url('../../media/background.jpeg')] bg-cover bg-center w-[80%]">
                    <h3 class="font-medium text-[18px] text-center mt-[16px]">Connexion</h3>
                    <form class="flex flex-col gap-[16px] items-center w-full">
                        <input class="w-[90%] border placeholder-black font-normal text-[16px] pl-[16px] py-[8px] rounded-[10px] bg-[#EDEEF2] focus:placeholder-transparent" type="text" autocomplete="on" name="identifiant" id="identifiant" placeholder="Identifiant">
                        <input class="w-[90%] border placeholder-black font-normal text-[16px] pl-[16px] py-[8px] rounded-[10px] bg-[#EDEEF2] focus:placeholder-transparent" type="password" autocomplete="current-password" name="password" id="password" placeholder="Mot de passe">
                    </form>
                    <!-- <p class="font-normal text-[14px] w-fit border-b">Mot de passe oublié</p> -->
                </div>
                <button class="inset-shadow-sm/50 font-medium text-[18px] text-white bg-[#324A5F] py-[8px] w-[80%] rounded-[30px]">S'identifier</button>
            </div>
        </main>
        <div id="alertFaild" class="fixed top-4 right-4 bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded shadow-md hidden"></div>
        
        <script src="../js/connexion.js"></script>
    </body>
</html>
